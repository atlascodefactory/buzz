[package]
name = "mesh-llm-system"
version = "0.76.2"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Host system inspection and update helpers for mesh-llm"
repository = "https://github.com/Mesh-LLM/mesh-llm"
homepage = "https://github.com/Mesh-LLM/mesh-llm"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
dirs = "6.0.0"
hex = "0.4.3"
libc = "0.2.183"
libloading = "0.9"
mesh-llm-build-info = { version = "0.76.2", git = "https://github.com/Mesh-LLM/mesh-llm.git", tag = "v0.76.2" }
mesh-llm-gpu-bench = { git = "https://github.com/Mesh-LLM/mesh-llm.git", tag = "v0.76.2", version = "0.76.2"  }
mesh-llm-native-runtime = { git = "https://github.com/Mesh-LLM/mesh-llm.git", tag = "v0.76.2", version = "0.76.2" }
mesh-llm-release-footer = { version = "0.76.2", git = "https://github.com/Mesh-LLM/mesh-llm.git", tag = "v0.76.2" }
mesh-llm-runtime-install = { git = "https://github.com/Mesh-LLM/mesh-llm.git", tag = "v0.76.2", version = "0.76.2" }
reqwest = { version = "0.13", features = ["stream", "json", "query"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
skippy-runtime = { git = "https://github.com/Mesh-LLM/mesh-llm.git", tag = "v0.76.2", version = "0.76.2", optional = true  }
tracing = "0.1"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

[features]
skippy-devices = ["dep:skippy-runtime"]
dynamic-native-runtime = ["skippy-devices", "skippy-runtime/dynamic-native-runtime"]

[dev-dependencies]
serial_test = "4"

# This patched dependency is not a member of the Buzz workspace.
[workspace]
