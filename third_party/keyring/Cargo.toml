[package]
authors = ["Daniel Brotsky <dev@brotsky.com>"]
description = "All-in-One Rust Keyring"
readme = "README.md"
repository = "https://github.com/open-source-cooperative/keyring-rs"
homepage = "https://github.com/open-source-cooperative/keyring-rs/wiki/Keyring"
keywords = ["password", "credential", "keychain", "keyring", "cross-platform"]
license = "MIT OR Apache-2.0"
name = "keyring"
version = "4.2.0"
edition = "2024"
rust-version = "1.88.0"
exclude = [".github"]

[features]
default = ["v1"]
v1 = [
    "apple-native-keyring-store/keychain",
    "windows-native-keyring-store",
    "dbus-secret-service-keyring-store"
]
[dependencies]
keyring-core = "1.0.0"

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
apple-native-keyring-store = { version = "1", optional = true }

[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
dbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust", "vendored"], optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = { version = "1", optional = true }

[package.metadata.docs.rs]
all-features = true
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-gnu",
    "x86_64-linux-android",
    "x86_64-unknown-freebsd",
    "aarch64-apple-darwin",
    "aarch64-apple-ios"
]

[workspace]
