[package]
name = "mesh-llm-plugin-manager"
edition = "2024"
license = "MIT OR Apache-2.0"
version = "0.76.2"
description = "Plugin package management primitives for Mesh LLM"
repository = "https://github.com/Mesh-LLM/mesh-llm"
homepage = "https://github.com/Mesh-LLM/mesh-llm"
readme = "README.md"

[lints.clippy]
cognitive_complexity = "warn"
too_many_lines = "warn"

[dependencies]
hex = "0.4"
anyhow = "1"
dirs = "6"
flate2 = "1"
futures-util = "0.3"
mesh-llm-skills = { version = "0.76.2", git = "https://github.com/Mesh-LLM/mesh-llm.git", tag = "v0.76.2" }
reqwest = { version = "0.13", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tar = "0.4"
tempfile = "3"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

[dev-dependencies]

# This patched dependency is not a member of the Buzz workspace.
[workspace]
