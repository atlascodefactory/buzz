name: Desktop security native tests
on:
  pull_request:
    paths:
      - 'desktop/src-tauri/**'
      - 'third_party/tauri-plugin-updater/**'
      - '.github/workflows/desktop-security-native.yml'
permissions:
  contents: read
jobs:
  windows-updater:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Test actual Windows updater extraction
        shell: pwsh
        run: cargo test --manifest-path desktop/src-tauri/Cargo.toml --locked -p tauri-plugin-updater --lib
